# Builds ready-to-install Geomancer for Windows, macOS and Linux.
# Push a tag like v0.2 (or run it by hand from the Actions tab) and the zips land on a Release page.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-22.04,   name: Linux }   # older glibc = runs on newer distros too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGEOMANCER_TESTS=OFF -DGEOMANCER_COPY_AFTER_BUILD=OFF $extra

      - name: Build
        shell: bash
        run: |
          targets="--target Geomancer_VST3 --target Geomancer_Standalone"
          if [ "$RUNNER_OS" = "macOS" ]; then targets="$targets --target Geomancer_AU"; fi
          cmake --build build --config Release --parallel 4 $targets

      - name: Package
        shell: bash
        run: |
          art=$(find build -type d -path "*Geomancer_artefacts/Release" | head -1)
          mkdir -p pkg/Geomancer
          cp -R "$art/VST3/Geomancer.vst3" pkg/Geomancer/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$art/AU/Geomancer.component" pkg/Geomancer/
            cp -R "$art/Standalone/Geomancer.app" pkg/Geomancer/
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "$art/Standalone/Geomancer.exe" pkg/Geomancer/
          else
            cp "$art/Standalone/Geomancer" pkg/Geomancer/Geomancer-standalone
          fi
          cp README.md pkg/Geomancer/
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -r ../Geomancer-${{ matrix.name }}.zip Geomancer; else zip -qry ../Geomancer-${{ matrix.name }}.zip Geomancer; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Geomancer-${{ matrix.name }}
          path: Geomancer-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: Geomancer-*.zip
          generate_release_notes: true
